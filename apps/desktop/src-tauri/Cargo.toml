[package]
name = "belegwerk-desktop"
version = "0.1.0"
description = "Belegwerk desktop shell (Tauri 2)"
authors = ["Belegwerk"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "belegwerk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
belegwerk-domain = { path = "../../../crates/domain" }
belegwerk-application = { path = "../../../crates/application" }
belegwerk-infrastructure = { path = "../../../crates/infrastructure" }
belegwerk-plugin-host = { path = "../../../crates/plugin-host" }
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
