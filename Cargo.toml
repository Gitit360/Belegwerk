[workspace]
resolver = "2"
# Desktop (Tauri) lives in apps/desktop/src-tauri as a nested package so Linux CI
# can build/test crates without WebKitGTK. Build the app with `pnpm tauri:build` on macOS.
members = [
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/plugin-host",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Belegwerk"]
repository = "https://github.com/Gitit360/Belegwerk"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
getrandom = "0.3"
